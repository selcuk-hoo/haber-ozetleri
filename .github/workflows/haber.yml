name: Haber Üret ve Yayınla

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
  push:
    branches:
      - claude/fervent-ritchie-r9c4rq
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/haber.yml"

permissions:
  contents: write

concurrency:
  group: yayin
  cancel-in-progress: false

jobs:
  uret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install trafilatura feedparser
      - run: python scripts/haber_uret.py

      # Pages'in "GitHub Actions" kaynağı aynı commit'i ikinci kez
      # yayınlamıyor: zamanlayıcı hep main'in aynı ucunu tetiklediği için
      # deploy "success" görünüp içerik değişmiyordu. Çıktıyı ayrı bir dala
      # yazınca her çalıştırma yeni bir commit oluyor ve yayın hep geçiyor.
      # Dal her seferinde sıfırdan kurulup force-push ediliyor, yani depoda
      # tek commit olarak durur; içinde elle yazılmış hiçbir şey yok.
      - name: Yayınla (gh-pages dalına yaz)
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          touch dist/.nojekyll
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Haber güncellemesi ($(date -u '+%Y-%m-%d %H:%M UTC'), çalıştırma ${GITHUB_RUN_NUMBER})"
          git push -q --force \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages
