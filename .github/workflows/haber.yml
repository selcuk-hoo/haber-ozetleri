name: Haber Üret ve Yayınla

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
  push:
    branches:
      - claude/fervent-ritchie-r9c4rq
      - main
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/haber.yml"

permissions:
  contents: write

# Aynı daldaki çalıştırmalar sırayla gider (main'dekiler gh-pages'e ve
# arşive yazdığı için üst üste binmemeli). Grup dala göre ayrı: tek bir
# grupta bekleyen en fazla bir çalıştırma olabiliyor, ortak grupta
# geliştirme dalına yapılan bir push main'in bekleyen yayınını iptal
# ediyordu (çalıştırma 333).
concurrency:
  group: yayin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  uret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install trafilatura feedparser

      # Özet temizliği kurallarının testleri; bir kural değişikliği bir
      # şeyi bozduysa bozuk özetler yayına çıkmadan çalışma burada durur.
      - run: python -m unittest discover -s tests -v

      # GEÇİCİ: yeni kaynaklar ve translate.goog teşhisi (sadece geliştirme dalında)
      - if: github.ref != 'refs/heads/main'
        continue-on-error: true
        run: python .github/teshis/yeni.py

      # html2canvas: "Paylaş" butonu için kart görselini PNG'ye çeviren
      # kütüphane. Sayfanın kendi <script>'ine gömülüyor (bkz.
      # sayfa.py, HTML2CANVAS_DOSYASI) çünkü translate.goog (otomatik
      # Türkçe çeviri) ayrı bir <script src> ile yüklenen üçüncü taraf CDN
      # dosyasını düzgün proxy'lemiyor gibi görünüyor — "Paylaş" butonu
      # çeviri sürümünde hiç çalışmıyordu. Dosya sadece depoda henüz
      # yoksa indirilip commit'lenir; sonraki çalıştırmalar bir şey yapmaz.
      - name: html2canvas'ı vendor'la (yoksa)
        run: |
          if [ ! -f scripts/vendor/html2canvas.min.js ]; then
            mkdir -p scripts/vendor
            curl -fsSL -o scripts/vendor/html2canvas.min.js https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/vendor/html2canvas.min.js
            git commit -q -m "html2canvas kütüphanesini vendor'la"
            git push -q origin HEAD:${GITHUB_REF#refs/heads/}
          fi

      # "Older news" arşivi (bkz. scripts/arsiv.py) yayınlanan sitenin
      # yanında, gh-pages'teki arsiv.json'da duruyor: main'e her yarım
      # saatte bir commit düşmesin diye depoda değil. Üretim bir önceki
      # yayındaki listeyi dist/'ten okuyup güncelliyor, yayın adımı da
      # yenisini tekrar gh-pages'e yazıyor. Dosya yoksa (ilk çalıştırma)
      # arşiv boş başlar. Geliştirme dalı da okur ama yayınlamadığı için
      # arşivi değiştirmez.
      - name: Önceki arşivi ve çevirileri al
        run: |
          # gh-pages okunamazsa (GitHub'da geçici hata) boş arşivle devam
          # etmek bir haftalık listeyi silerdi; bu yüzden birkaç kez
          # denenir, yine olmazsa çalıştırma yayınlamadan durur. Dal
          # okunup içinde arsiv.json yoksa (ilk kez) boş başlanır.
          mkdir -p dist
          okundu=
          for bekleme in 10 30 60 0; do
            if git fetch -q --depth=1 origin gh-pages; then okundu=1; break; fi
            [ "$bekleme" -gt 0 ] || break
            echo "gh-pages okunamadı, ${bekleme} sn sonra tekrar denenecek"
            sleep "$bekleme"
          done
          [ -n "$okundu" ] || { echo "gh-pages okunamadı; arşiv silinmesin diye yayın yapılmıyor"; exit 1; }
          # arsiv.json: eski haberler; ceviri.json: Türkçe çeviri önbelleği
          # (bkz. scripts/ceviri.py; yoksa her şey yeniden çevrilir).
          for dosya in arsiv.json ceviri.json; do
            if git show "FETCH_HEAD:$dosya" > "/tmp/$dosya" 2>/dev/null; then
              mv "/tmp/$dosya" "dist/$dosya"
            else
              echo "Önceki $dosya bulunamadı, boş başlanıyor"
            fi
          done

      - run: python scripts/haber_uret.py

      # scripts/ilk_gorulme.json: gerçek RSS'i olmayan kaynaklarda (CNN,
      # Al Jazeera gibi) hiçbir yerde tarih bulunamadığında tarih.py
      # bu dosyaya "bu url'yi ilk gördüğümüz an"ı yazıyor, sonraki
      # çalıştırmalarda o an yeniden kullanılıyor. Sadece main'de commit
      # ediliyor (dev dalındaki test çalıştırmaları bu dosyayı
      # main'den ayrıştırmasın diye); normal bir commit'tir, force
      # kullanılmaz. Push başarısız olursa (ör. tam o anda başka bir
      # commit main'e girmişse) bir sonraki çalıştırma dener, akışı
      # durdurmaz.
      - name: İlk görülme kaydını commit'le
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -n "$(git status --porcelain scripts/ilk_gorulme.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/ilk_gorulme.json
            git commit -q -m "İlk görülme kaydını güncelle (çalıştırma ${GITHUB_RUN_NUMBER})"
            git push -q origin HEAD:main || echo "İlk görülme kaydı push edilemedi, bir sonraki çalıştırmada tekrar denenecek"
          fi

      # Pages'in "GitHub Actions" kaynağı aynı commit'i ikinci kez
      # yayınlamıyor: zamanlayıcı hep main'in aynı ucunu tetiklediği için
      # deploy "success" görünüp içerik değişmiyordu. Çıktıyı ayrı bir dala
      # yazınca her çalıştırma yeni bir commit oluyor ve yayın hep geçiyor.
      # Dal her seferinde sıfırdan kurulup force-push ediliyor, yani depoda
      # tek commit olarak durur; içinde elle yazılmış hiçbir şey yok.
      - name: Yayınla (gh-pages dalına yaz)
        if: github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          touch dist/.nojekyll
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Haber güncellemesi ($(date -u '+%Y-%m-%d %H:%M UTC'), çalıştırma ${GITHUB_RUN_NUMBER})"
          # GitHub ara sıra push'u geçici bir sunucu hatasıyla (500)
          # reddediyor; tek bir aksaklık yüzünden çalıştırma başarısız
          # olmasın diye birkaç kez, artan aralıklarla deneniyor.
          for bekleme in 10 30 60 0; do
            if git push -q --force \
              "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              HEAD:gh-pages; then
              exit 0
            fi
            [ "$bekleme" -gt 0 ] || break
            echo "gh-pages push başarısız, ${bekleme} sn sonra tekrar denenecek"
            sleep "$bekleme"
          done
          exit 1
